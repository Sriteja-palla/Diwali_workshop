<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sweet</title>
    <style>
      body { margin:0; font-family: Arial; background:#fff7ed; }
      .box { max-width:500px; margin:40px auto; background:white; padding:25px; border-radius:12px; border:1px solid #ddd; }
      .box h2 { text-align:center; margin-top:0; }
      .box form p { margin-bottom:15px; }
      .box label { font-weight:bold; display:block; margin-bottom:5px; }
      .box input, .box select { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
      .btn { width:100%; background:blueviolet; color:white; border:none; padding:12px; border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
      .back { display:block; text-align:center; margin-top:15px; text-decoration:none; color:#333; font-weight:bold; }
    </style>
</head>
<body>
<div class="box">
  <h2> Add Sweet</h2>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Add Sweet</button>
  </form>
  <a class="back" href="/">← Back to Home</a>
</div>
</body>
</html>
