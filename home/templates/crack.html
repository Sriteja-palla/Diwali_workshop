<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            justify-content: center;
            display: flex;
        }
        .crack{
            padding: 20px;
            width: 500px;
            border: 2px solid ;
            border-radius: 10px;
            background-color: blueviolet;
            color: aliceblue;
            margin-top: 40px;
            /* justify-content: center; */
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        form p{
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin: 0;
        }
        input ,select{
            padding: 8px;
            width: 100%;
        }
        button{
            padding: 10px;
            margin-top: 10px;
        }
        </style>
</head>
<body>
    <div class="crack">
    <h1 style="text-align: center;"> ADD CRACKERS</h1>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit">ADD</button>
    </form>
    </div>
</body>
</html>
